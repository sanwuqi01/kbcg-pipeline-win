name: contract-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    env:
      # GitHub Windows runner 控制台是 cp1252，脚本里的 ✅⛔ emoji 会崩
      # （与生产机相同的约束：管线入口都强制 UTF-8，见 SKILL.md「环境」节）
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 42 项契约回归
        working-directory: .workbuddy/skills/kbcg-xgz-win-workbuddy
        shell: cmd
        run: python -X utf8 -m unittest tests.test_learning_contracts -v

      - name: Mac 残留扫描（真命中必须为 0）
        working-directory: .workbuddy/skills/kbcg-xgz-win-workbuddy/脚本_win
        run: python -X utf8 -c "import pipeline; hits, retained = pipeline.scan_mac_residue(); print('真命中:', len(hits)); assert not hits, hits"

      - name: 冒烟：状态机可导入、--help 可用
        working-directory: 剪辑工作台/工具
        run: python -X utf8 剪辑.py --help

      - name: 外部输入输出与配置路径
        shell: cmd
        run: python -X utf8 -m unittest discover -s 剪辑工作台/工具/tests -p test_*.py -v
