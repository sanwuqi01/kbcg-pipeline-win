name: contract-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    env:
      # GitHub Windows runner 控制台是 cp1252，脚本里的 ✅⛔ emoji 会崩
      # （与生产机相同的约束：管线入口都强制 UTF-8，见 SKILL.md「环境」节）
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 42 项契约回归
        working-directory: .workbuddy/skills/kbcg-xgz-win-workbuddy
        shell: cmd
        run: python -X utf8 -m unittest tests.test_learning_contracts -v

      - name: 环境自检（契约部分）
        working-directory: .workbuddy/skills/kbcg-xgz-win-workbuddy
        shell: cmd
        # doctor 会因无剪映/CapCutMate 报缺件——这是预期（CI 机器不是生产机）；
        # 只要求「Mac 残留扫描」和「运行时断言」两节不失败。退出码容忍。
        run: |
            脚本_win\pipeline.py doctor > doctor.log 2>&1
            if exit_code neq 0 type doctor.log
            findstr /C:"Mac 专属调用残留扫描" /C:"没有 Mac 命令" doctor.log
            findstr /C:"Windows 运行时断言" /C:"未触发" doctor.log

      - name: 冒烟：状态机 --help
        working-directory: 剪辑工作台/工具
        shell: cmd
        run: python -X utf8 剪辑.py --help
